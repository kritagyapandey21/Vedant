# TradingSignal: ONE self-contained Nginx file, safe to add next to other sites.
#
#   * answers ONLY for __DOMAIN__ (it never becomes the default server)
#   * every shared name (rate-limit zones, SSL cache) is prefixed ts_ so it cannot clash with other configs
#   * no global settings are changed (no server_tokens, no HSTS includeSubDomains/preload)
#   * the backends listen on 127.0.0.1 only; Nginx is the only way in
#
# Install (see backend/docs/DEPLOY_VPS.md):
#   sed -e 's/__DOMAIN__/signals.example.com/g' -e 's/__PO_PORT__/8001/g' -e 's/__QX_PORT__/8002/g' \
#       nginx-tradingsignal.conf > /etc/nginx/conf.d/tradingsignal.conf
#   nginx -t && systemctl reload nginx          # reload, never restart: other sites keep serving
#
#   /               landing page, /login/ shared login      -> /opt/tradingsignal/frontend/landing
#   /pocketoption/  Pocket Option terminal + /api/          -> backend on 127.0.0.1:__PO_PORT__
#   /quotex/        Quotex terminal + /quotex-api/          -> backend on 127.0.0.1:__QX_PORT__

limit_req_zone  $binary_remote_addr zone=ts_login:5m rate=10r/m;
limit_req_zone  $binary_remote_addr zone=ts_api:10m  rate=120r/m;
limit_conn_zone $binary_remote_addr zone=ts_conn:5m;

# --- port 80: certificate checks, then everything goes to HTTPS ---
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    location /.well-known/acme-challenge/ { root /var/www/ts-acme; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __DOMAIN__;

    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:ts_ssl:5m;
    ssl_session_tickets off;

    server_tokens off;                      # per-site only
    root /opt/tradingsignal/frontend/landing;
    index index.html;
    client_max_body_size 64k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    limit_conn ts_conn 40;

    # HSTS for this hostname only (no includeSubDomains / preload, so the parent domain and other sites are unaffected)
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

    location ~ /\. { deny all; return 404; }
    location ~* \.(env|py|sqlite3?|log|bak|old|md|conf)$ { deny all; return 404; }

    # landing + login (nginx drops parent add_header lines when a location sets its own, so repeat them)
    location / {
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        try_files $uri $uri/ =404;
    }

    # terminals (static files)
    location = /pocketoption { return 301 /pocketoption/; }
    location = /quotex       { return 301 /quotex/; }
    location /pocketoption/ {
        alias /opt/tradingsignal/frontend/pocketoption/;
        index index.html;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri/ =404;
    }
    location /quotex/ {
        alias /opt/tradingsignal/frontend/quotex/;
        index index.html;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri/ =404;
    }

    # APIs: login gets a tighter rate limit than data endpoints
    location = /api/verify-trader {
        limit_req zone=ts_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:__PO_PORT__/verify-trader;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /quotex-api/verify-trader {
        limit_req zone=ts_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:__QX_PORT__/verify-trader;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/ {
        limit_req zone=ts_api burst=30 nodelay;
        proxy_pass http://127.0.0.1:__PO_PORT__/;
        proxy_http_version 1.1;
        proxy_read_timeout 60s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /quotex-api/ {
        limit_req zone=ts_api burst=30 nodelay;
        proxy_pass http://127.0.0.1:__QX_PORT__/;
        proxy_http_version 1.1;
        proxy_read_timeout 60s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
