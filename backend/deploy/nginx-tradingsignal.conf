# Hardened Nginx layout for tradingsignal.in
#   /               -> landing page (static), /login/ -> shared broker login
#   /pocketoption/  -> AUROX AI (Pocket Option) frontend + /api/        -> backend on 127.0.0.1:8001
#   /quotex/        -> AUROX AI (Quotex) frontend        + /quotex-api/ -> backend on 127.0.0.1:8002
# Backends must listen on 127.0.0.1 only. TLS certificates are added with certbot.

# --- rate limiting (per client IP) ---
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api:10m   rate=120r/m;
limit_conn_zone $binary_remote_addr zone=perip:10m;

server_tokens off;

# --- plain HTTP: redirect everything to HTTPS ---
server {
    listen 80;
    server_name tradingsignal.in www.tradingsignal.in;
    return 301 https://tradingsignal.in$request_uri;
}

server {
    listen 443 ssl http2;
    server_name tradingsignal.in www.tradingsignal.in;

    # ssl_certificate / ssl_certificate_key are filled in by certbot
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    root /var/www/landing;
    index index.html;
    client_max_body_size 64k;              # login/API payloads are tiny
    client_body_timeout 10s;
    client_header_timeout 10s;
    limit_conn perip 40;

    # --- headers on every response ---
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # never expose dotfiles / backups
    location ~ /\. { deny all; return 404; }
    location ~* \.(env|py|sqlite3?|log|bak|old|md|conf)$ { deny all; return 404; }

    # --- landing page + login: strict CSP (no inline scripts) ---
    location / {
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
        # add_header must be repeated here because nginx drops parent add_header lines when a location defines its own
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        try_files $uri $uri/ =404;
    }

    # --- terminals (their own scripts are inline, so no script CSP here) ---
    location /pocketoption/ {
        alias /var/www/aurox/frontend/;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri/ /pocketoption/index.html;
    }
    location /quotex/ {
        alias /var/www/aurox-qx/frontend/;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri/ /quotex/index.html;
    }

    # --- APIs (reverse proxy; backends only listen on 127.0.0.1) ---
    # login endpoints get a much tighter rate limit than the data endpoints
    location = /api/verify-trader {
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8001/verify-trader;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /quotex-api/verify-trader {
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8002/verify-trader;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/ {
        limit_req zone=api burst=30 nodelay;
        proxy_pass http://127.0.0.1:8001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /quotex-api/ {
        limit_req zone=api burst=30 nodelay;
        proxy_pass http://127.0.0.1:8002/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
